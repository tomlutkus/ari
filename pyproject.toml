[project]
name = "ari"
version = "0.2.0"
description = "One record per SSH host; generates ssh config and Ansible inventory"
readme = "README.md"
authors = [{ name = "Thomas Lutkus", email = "thomas@lutkus.net" }]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
ari = "ari.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
