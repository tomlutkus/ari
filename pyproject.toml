[project]
name = "ari"
version = "0.4.1"
description = "One record per SSH host; generates ssh config and Ansible inventory"
readme = "README.md"
authors = [{ name = "Thomas Lutkus", email = "thomas@lutkus.net" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
ari = "ari.cli:main"

# Built-in modules register exactly the way third-party ones do.
[project.entry-points."ari.modules"]
ssh = "ari.modules.ssh:SshModule"
ansible = "ari.modules.ansible:AnsibleModule"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
